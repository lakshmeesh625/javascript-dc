    <script>
let willYouPlay = confirm("Lets play rock paper and scissors")
if(willYouPlay ){
    
    let userChoice = prompt("Choose betweeen rocks paper and scissor")
    userChoice = userChoice.trim().toLowerCase();
if(userChoice === "rock" || userChoice === "paper" || userChoice === "scossor"){

    let choices = ["Rock" , "Paper" , "Scissor"]
    let computerChoice = choices[Math.floor(Math.random() * choices.length)]
    console.log(computerChoice);

    if(computerChoice === userChoice){
        console.log("The game is tied");
    }
    else if(computerChoice === "rock" && userChoice === "paper"){
        alert("The player wins the game");
    }

    else if(computerChoice === "paper" && userChoice === "scissor"){
        alert("The player wins the game");
    }
    else if(computerChoice === "scissor" && userChoice === "rock"){
        alert("The player wins the game");
    }
    else {
        alert("The computer wins the game");
    }
    let playAgain = confirm("Play again")
    playAgain ?  location.reload() : alert("Thanks for playing")



}
else{
    alert("You didnt choose rock / paper / scissor")
}


    
    



}
else{
    alert("No worries we will play the next time")
}
 
    </script>
